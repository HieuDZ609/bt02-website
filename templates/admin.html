<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ENCOM UPLINK .ADM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <main class="admin-main container">
    <section class="panel" aria-labelledby="admin-title">
      <div class="panel__bar">
        <span class="panel__code">ADM | 066</span>
        <span class="panel__title" id="admin-title">ENCOM UPLINK .ADM</span>
        <span class="panel__status"><span class="dot"></span> SECURE</span>
      </div>
      <div class="panel__body">

        {% if mode == "login" %}
        <p class="prompt">encom_root<span class="prompt__path">:~$</span> login --admin --secure<span class="caret" aria-hidden="true"></span></p>
        <form method="POST" action="/admin/login" class="message-form login-box" novalidate>
          <label class="field">
            <span class="field__label">Passphrase</span>
            <input id="password" class="text-input" type="password" name="password"
              autocomplete="current-password" required autofocus />
          </label>
          <div class="form-actions">
            <button type="submit" class="btn btn--primary">LOGIN</button>
            <span class="form-status {% if is_error %}err{% else %}ok{% endif %}" role="status" aria-live="polite">{{ message }}</span>
          </div>
        </form>

        {% else %}
        <p class="prompt">encom_root<span class="prompt__path">:~$</span> whoami<span class="caret" aria-hidden="true"></span></p>
        <p class="admin-whoami">ACCESS GRANTED · root@encom</p>
        <form method="POST" action="/admin/banner" class="message-form login-box" novalidate>
          <label class="field">
            <span class="field__label">Top banner message</span>
            <textarea id="banner" class="text-input" name="banner" rows="4"
              maxlength="{{ max_len }}" required>{{ banner }}</textarea>
          </label>
          <div class="form-actions">
            <button type="submit" class="btn btn--primary">SAVE</button>
            <span class="form-status {% if is_error %}err{% else %}ok{% endif %}" role="status" aria-live="polite">{{ message }}</span>
          </div>
        </form>
        <form method="POST" action="/admin/logout" class="logout-form">
          <button type="submit" class="btn btn--ghost">LOGOUT</button>
        </form>
        {% endif %}

        <p class="admin-back"><a href="/">◂ BACK TO HOMEPAGE</a></p>
      </div>
    </section>
  </main>
</body>
</html>
